stages: [build, test]

build:
  stage: build
  parallel: &runners
    matrix:
      - emacs: "emacs:25"
      - emacs: "emacs:26"
      - emacs: "emacs:27"
      - emacs: "emacs:28"
      - emacs: "emacs:29"
  image: silex/$emacs-ci-cask
  before_script: &setup_cask
    - cask install
    - cask update
  script: &byte-compile
    - cask emacs -batch -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile yas-autoinsert*.el


test:
  stage: test
  needs: ["build"]
  parallel: *runners
  image: silex/$emacs-ci-cask
  before_script:
    - *setup_cask
    - *byte-compile
  script:
    - cask exec buttercup -L .

