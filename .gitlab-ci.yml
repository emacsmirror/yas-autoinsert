stages: [build, test]

build:
  stage: build
  parallel: &runners
    matrix:
      - emacs: "emacs:25"
      - emacs: "emacs:26"
      - emacs: "emacs:27"
      - emacs: "emacs:28"
      - emacs: "emacs:29"
      - emacs: "emacs:30"
      - emacs: "emacs:31"
  image: silex/$emacs-eldev
  before_script:
    - eldev clean
  script:
    - eldev lint
    - eldev compile
  artifacts:
    paths:
      - .eldev/

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  parallel: *runners
  image: silex/$emacs-eldev
  script:
    - eldev test

